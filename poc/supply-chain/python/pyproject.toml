[project]
name = "cpie-python-supply-chain-poc"
version = "0.1.0"
description = "Isolated dependency-locking and clean-reconstruction POC for CPIE."
requires-python = ">=3.12,<3.16"
dependencies = [
  "lightgbm==4.7.0",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "polars==2.1.0",
  "psutil==7.2.2",
  "pyarrow==26.0.1",
  "scikit-learn==1.9.1",
  "threadpoolctl==3.8.0",
  "xgboost==3.4.1",
]

[project.optional-dependencies]
pytorch-cpu = [
  "torch==2.15.0+cpu; python_version < '3.13'",
]

[dependency-groups]
compatibility = [
  "fastapi",
  "pydantic",
  "scipy>=1.18.1",
  "statsmodels",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'win32' and implementation_name == 'cpython' and python_version < '3.13'",
  "sys_platform == 'win32' and implementation_name == 'cpython' and python_version >= '3.15'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
