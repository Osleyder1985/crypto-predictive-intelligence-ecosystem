[project]
name = "cpie-sbom-tooling-poc"
version = "0.1.0"
description = "Isolated, pinned CycloneDX SBOM generator environment for CPIE supply-chain POC."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cyclonedx-bom==7.6.0",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'win32' and implementation_name == 'cpython' and python_version == '3.12'",
]
