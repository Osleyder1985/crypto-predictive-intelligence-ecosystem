name: Web frontend framework POCs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/web-frontend-poc.yml"
      - "poc/frontend/shared/**"
      - "poc/frontend/next-app/**"
      - "poc/frontend/react-spa/**"

permissions:
  contents: read

jobs:
  web-framework-poc:
    name: ${{ matrix.app }} · Node.js 26.13.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - next-app
          - react-spa

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false

      - name: Record toolchain
        working-directory: poc/frontend/${{ matrix.app }}
        run: |
          node --version
          npm --version

      - name: Generate lockfile from pinned direct dependencies
        working-directory: poc/frontend/${{ matrix.app }}
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        working-directory: poc/frontend/${{ matrix.app }}
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        working-directory: poc/frontend/${{ matrix.app }}
        run: npm run typecheck

      - name: Production build
        working-directory: poc/frontend/${{ matrix.app }}
        run: npm run build

      - name: Upload build and generated lockfile
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: web-poc-${{ matrix.app }}-node-26.13.1
          path: |
            poc/frontend/${{ matrix.app }}/package-lock.json
            poc/frontend/${{ matrix.app }}/.next
            poc/frontend/${{ matrix.app }}/dist
          if-no-files-found: warn
