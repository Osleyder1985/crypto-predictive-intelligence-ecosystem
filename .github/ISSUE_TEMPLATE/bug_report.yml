name: Reportar un defecto
description: Registrar un comportamiento incorrecto reproducible.
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: "Describe hechos observables. No incluyas secretos, tokens ni datos personales."
  - type: textarea
    id: summary
    attributes:
      label: Resumen
      description: ¿Qué comportamiento falla?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento observado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno y versiones
      description: Sistema operativo, versión, commit, configuración no sensible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia y logs saneados
      description: Adjunta evidencia sin credenciales ni información sensible.
  - type: textarea
    id: impact
    attributes:
      label: Impacto, severidad y alcance
      description: Explica usuarios, módulos y operaciones afectados; no inventes métricas.
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: ¿Qué evidencia demostrará que el defecto quedó corregido?
    validations:
      required: true
